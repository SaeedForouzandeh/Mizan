name: Android Signed Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'نام نسخه (مثلاً 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'شماره نسخه عددی (مثلاً 1)'
        required: false
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Android Release APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build, harden & sign Android Release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          chmod +x scripts/build-android.sh
          EXTRA_FLAGS=""
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            EXTRA_FLAGS="--allow-ephemeral-keystore"
          fi
          bash scripts/build-android.sh \
            --all \
            --version-name "${VERSION_NAME#v}" \
            --version-code "${VERSION_CODE}" \
            $EXTRA_FLAGS

      - name: Upload Signed APK, AAB & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: mizan-android-signed
          path: |
            release-artifacts/mizan-release-signed.apk
            release-artifacts/mizan-release-signed.aab
            release-artifacts/SHA256SUMS.txt

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/mizan-release-signed.apk
            release-artifacts/mizan-release-signed.aab
            release-artifacts/SHA256SUMS.txt
